name = "wormstar-ai-lab"
main = "worker.js"
compatibility_date = "2026-10-25"
workers_dev = true

# Minimal valid observability config for current Wrangler releases.
# The previous nested settings (`redact_query_string`, `traces`, `issues`) are
# not accepted by the Wrangler version used by this CI workflow and caused the
# deployment to fail during config validation.
[observability]
enabled = true

[ai]
binding = "AI"

[[d1_databases]]
binding = "DB"
database_name = "wormstar_ai_memory"
database_id = "d9d08aa3-184f-47aa-bc2b-a9f53c0bd2aa"

[[vectorize]]
binding = "VECTORS"
index_name = "wormstar-knowledge-m3"

# Conservative scope: only Workers owned by this Cloudflare account.
[vars]
SCAN_ALLOWED_HOSTS = "wormstar-sentinel-preview.abdulstarzeki001.workers.dev,wormstar-ai-lab.abdulstarzeki001.workers.dev"

# Dedicated, isolated project-repository vector memory.
[[vectorize]]
binding = "REPO_VECTORS"
index_name = "wormstar-repository-m3"

# Incremental GitHub sync; catches source changes without any browser credentials.
[triggers]
crons = ["7,22,37,52 * * * *"]

# Internal, credential-free routes to the local-only OSINT/Audit viewers.
[[services]]
binding = "SENTINEL_SUITE"
service = "wormstar-sentinel-preview"
