name: Deploy Cloudflare Worker

on:
  push:
    branches: [main]
    paths:
      - "cloudflare-worker/**"
      - ".github/workflows/deploy-cloudflare.yml"
  workflow_dispatch:

concurrency:
  group: deploy-cloudflare-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Require cross-lab quality gate
    uses: ./.github/workflows/quality-gate.yml
    permissions:
      contents: read

  deploy:
    needs: quality
    if: github.ref == 'refs/heads/main'
    name: Deploy wormstar-ai-lab
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare-worker
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Policy check
        run: |
          node --check worker.js
          node tools/sync-policy.mjs --check
          npm test

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare-worker
          command: deploy
          # Optional: pin a wrangler version for reproducible deploys
          # wranglerVersion: "4.14.1"

      - name: Post-deployment Core smoke check
        shell: bash
        run: |
          set -euo pipefail
          URL="https://wormstar-integration-hub.abdulstarzeki001.workers.dev/api/integrations"
          for attempt in 1 2 3 4; do
            if curl --fail --silent --show-error --max-time 20 --output /tmp/core-health.json "$URL" &&
               node -e "const v=require('/tmp/core-health.json');if(v.service!=='wormstar-integration-hub'||v.core?.connected!==true||v.core?.status!==200)process.exit(1)"; then
              echo "Core service-binding health verified (public Core login remains enforced)"
              exit 0
            fi
            sleep 4
          done
          echo "Core post-deployment health verification failed" >&2
          exit 1

      - name: Verify Cloudflare Access protects owner terminal and ticket API
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://wormstar-ai-lab.abdulstarzeki001.workers.dev"
          # Access is configured on the Worker destination. Anonymous requests
          # must redirect to the Cloudflare Access login, never reach a PTY.
          for entry in "GET /terminal/" "POST /api/terminal/session"; do
            method="${entry%% *}"
            endpoint="${entry#* }"
            status="$(curl --silent --show-error --max-time 20 \
              -X "$method" -D /tmp/access-headers.txt -o /tmp/access-body.bin \
              -w '%{http_code}' "$BASE$endpoint")"
            node - "$status" "$method" /tmp/access-headers.txt <<'NODE'
          const fs = require('fs');
          const [code,method,path] = process.argv.slice(2);
          const headers = fs.readFileSync(path,'utf8');
          const location = headers.match(/^location:\s*(.+)$/im)?.[1]?.trim();
          let target;
          try { target = new URL(location); }
          catch { process.stderr.write('No valid Cloudflare Access redirect\\n'); process.exit(1); }
          const access = target.hostname.endsWith('.cloudflareaccess.com') ||
            (target.hostname === 'wormstar-ai-lab.abdulstarzeki001.workers.dev' &&
             target.pathname.startsWith('/cdn-cgi/access/'));
          console.log(JSON.stringify({method,status:code,loginHost:target.hostname,loginPath:target.pathname}));
          if (code !== '302' || !access) {
            process.stderr.write('Anonymous request bypassed Cloudflare Access redirect\\n');
            process.exit(1);
          }
          NODE
          done
          echo "Cloudflare Access denies anonymous owner-terminal and ticket API requests"
