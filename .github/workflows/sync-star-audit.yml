name: Scheduled Star Cyber Audit Repository Sync

on:
  schedule:
    # Every day at 05:17 Asia/Baghdad (02:17 UTC)
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      approve_public_export:
        description: "Allow selected private source, paths and hashes to be published in a public review branch"
        type: boolean
        required: true
        default: false
  push:
    branches: [main]
    paths:
      - "scripts/sync_star_audit.py"
      - "scripts/tests/test_sync_star_audit.py"
      - "scripts/tests/test_sync_status.py"
      - "scripts/tests/test_sync_prereqs.py"
      - "scripts/ci/check-sync-prereqs.py"
      - "scripts/ci/report-sync-status.py"
      - ".github/workflows/sync-star-audit.yml"

permissions:
  contents: read

concurrency:
  group: star-audit-upstream-sync
  cancel-in-progress: false

jobs:
  stage-upstream-review:
    name: Stage approved upstream export and open a public review PR
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out Wormstar
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify private-source access and public export approval
        id: prerequisites
        env:
          SYNC_PUBLIC_EXPORT_APPROVED: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.approve_public_export || vars.STAR_AUDIT_PUBLIC_SYNC_APPROVED }}
          SYNC_READ_TOKEN: ${{ secrets.STAR_AUDIT_READ_TOKEN }}
        run: python3 scripts/ci/check-sync-prereqs.py

      - name: Check out original audit lab (untrusted content; never execute)
        id: checkout_upstream
        uses: actions/checkout@v4
        with:
          repository: abdulstarzeki001-sketch/Star-Cyber-Audit-iSH
          ref: main
          path: .star-audit-upstream
          token: ${{ secrets.STAR_AUDIT_READ_TOKEN }}
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Test the safe sync engine (local synthetic fixtures)
        run: python -m unittest discover -s scripts/tests -p "test_sync_*.py" -v

      - name: Create deterministic source mirror and 100% file inventory
        id: mirror_source
        run: |
          python scripts/sync_star_audit.py --source .star-audit-upstream
          python - <<'PY'
          import json
          from pathlib import Path
          info=json.loads(Path("integrations/star-cyber-audit-ish/SOURCE_INVENTORY.json").read_text())
          assert info["total_source_files"]==len(info["files"])
          assert info["copied_files"]+info["metadata_only_files"]==len(info["files"])
          print("Inventory:",info["total_source_files"],"source files;",
                info["copied_files"],"safe source copies;",
                info["metadata_only_files"],"archival metadata entries")
          PY

      - name: Propose upstream updates without changing deployed modules
        id: sync_pr
        # Some GitHub repositories disable PR creation by GITHUB_TOKEN.
        # Do not assume a branch was pushed if the PR action fails.
        continue-on-error: true
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ github.token }}
          branch: automation/star-audit-safe-upstream-sync
          base: main
          delete-branch: true
          add-paths: |
            integrations/star-cyber-audit-ish/upstream/**
            integrations/star-cyber-audit-ish/SOURCE_INVENTORY.json
          commit-message: "chore(upstream): stage reviewed iSH source mirror and 100% file inventory"
          title: "Sync upstream Star Cyber Audit iSH (safe source + complete inventory)"
          body: |
            Automatically proposed by the daily 05:17 Asia/Baghdad sync.

            - Copies allowlisted source and tooling into the `upstream/` snapshot after explicit export approval.
            - Generates a deterministic inventory of **every tracked upstream file** with Git blob hashes and byte sizes.
            - Filters known restricted paths and secret patterns; this does not guarantee all private information was detected.
            - Does **not** overwrite active Core/Sentinel/iSH code or automatically deploy untrusted source.
            - Review this diff, run Quality Gate and merge only when appropriate.
          labels: |
            dependencies
          draft: false

      - name: Record PR status and publish a review link
        if: always()
        env:
          PREREQUISITES_OUTCOME: ${{ steps.prerequisites.outcome }}
          UPSTREAM_CHECKOUT_OUTCOME: ${{ steps.checkout_upstream.outcome }}
          MIRROR_OUTCOME: ${{ steps.mirror_source.outcome }}
          PR_OUTCOME: ${{ steps.sync_pr.outcome }}
          PR_URL: ${{ steps.sync_pr.outputs.pull-request-url }}
        run: python3 scripts/ci/report-sync-status.py
