name: UBOOR offline security lab

on:
  push:
    paths:
      - 'training/uboor-security-lab/**'
      - 'scripts/run-uboor-lab.sh'
      - '.github/workflows/uboor-offline-lab.yml'
  pull_request:
    paths:
      - 'training/uboor-security-lab/**'
      - 'scripts/run-uboor-lab.sh'
      - '.github/workflows/uboor-offline-lab.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-offline-security-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run offline synthetic labs
        run: bash scripts/run-uboor-lab.sh
