name: Deploy Cloudflare Worker

on:
  push:
    branches: [main]
    paths:
      - "cloudflare-worker/**"
      - ".github/workflows/deploy-cloudflare.yml"
  workflow_dispatch:

concurrency:
  group: deploy-cloudflare-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Require cross-lab quality gate
    uses: ./.github/workflows/quality-gate.yml
    permissions:
      contents: read

  deploy:
    needs: quality
    if: github.ref == 'refs/heads/main'
    name: Deploy wormstar-ai-lab
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare-worker
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Policy check
        run: |
          node --check worker.js
          node tools/sync-policy.mjs --check
          npm test

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare-worker
          command: deploy
          # Optional: pin a wrangler version for reproducible deploys
          # wranglerVersion: "4.14.1"

      - name: Post-deployment Core smoke check
        shell: bash
        run: |
          set -euo pipefail
          URL="https://wormstar-integration-hub.abdulstarzeki001.workers.dev/api/integrations"
          for attempt in 1 2 3 4; do
            if curl --fail --silent --show-error --max-time 20 --output /tmp/core-health.json "$URL" &&
               node -e "const v=require('/tmp/core-health.json');if(v.service!=='wormstar-integration-hub'||v.core?.connected!==true||v.core?.status!==200)process.exit(1)"; then
              echo "Core service-binding health verified (public Core login remains enforced)"
              exit 0
            fi
            sleep 4
          done
          echo "Core post-deployment health verification failed" >&2
          exit 1

      - name: Verify owner terminal route rejects unauthenticated sessions
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://wormstar-ai-lab.abdulstarzeki001.workers.dev"
          # Terminal UI is publicly fetchable, but it may not open a shell until
          # the owner authorizes and obtains a short-lived signed ticket.
          curl --fail --silent --show-error --max-time 20 \
            --output /tmp/wormstar-owner-terminal.html "$BASE/terminal/"
          # Report a safe title and marker booleans. Never print HTML or tokens.
          node -e "const fs=require('fs');const h=fs.readFileSync('/tmp/wormstar-owner-terminal.html','utf8');const title=h.match(/<title>([^<]*)<\\/title>/i)?.[1]||'unknown';console.log(JSON.stringify({title,ownerSession:h.includes('/api/terminal/session'),ownerWebSocket:h.includes('/api/terminal/ws'),rawRailwayPrompt:h.includes('id=\\\"password\\\"')}));"
          if ! grep -q '/api/terminal/session' /tmp/wormstar-owner-terminal.html; then
            echo "ERROR: Owner session marker missing from deployed terminal HTML" >&2
            exit 1
          fi
          if ! grep -q '/api/terminal/ws' /tmp/wormstar-owner-terminal.html; then
            echo "ERROR: Owner WebSocket marker missing from deployed terminal HTML" >&2
            exit 1
          fi
          if grep -q 'id="password"' /tmp/wormstar-owner-terminal.html; then
            echo "ERROR: Password-only Railway HTML exposed at owner terminal path" >&2
            exit 1
          fi
          status="$(curl --silent --show-error --max-time 20 \
            -X POST -o /tmp/terminal-unauthorized.json \
            -w '%{http_code}' "$BASE/api/terminal/session")"
          test "$status" = '401' || {
            echo "ERROR: Unauthenticated ticket request was not rejected (HTTP $status)" >&2
            exit 1
          }
          node -e "const x=require('/tmp/terminal-unauthorized.json');if(x.ticket||!x.error)process.exit(1)"
          echo "Owner terminal route and unauthorized-ticket rejection verified"
