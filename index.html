<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Wormstar — AI Security Lab</title>
  <meta name="robots" content="noindex,follow">
  <meta http-equiv="refresh" content="0; url=https://wormstar-ai-lab.abdulstarzeki001.workers.dev/">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&family=Outfit:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; margin: 0; }
    body {
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #07090f;
      color: #eef1f7;
      font-family: 'IBM Plex Sans Arabic', system-ui, sans-serif;
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    body::before {
      content: '';
      position: fixed;
      width: 500px; height: 500px;
      top: -150px; right: -100px;
      background: radial-gradient(circle, rgba(124,108,255,.25), transparent 70%);
      filter: blur(80px);
      pointer-events: none;
    }
    main {
      position: relative;
      max-width: 440px;
      width: 100%;
      padding: 48px 36px;
      border-radius: 24px;
      background: rgba(18,24,38,.7);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,.1);
      box-shadow: 0 24px 60px rgba(0,0,0,.45);
    }
    .logo {
      width: 64px; height: 64px;
      margin: 0 auto 24px;
      border-radius: 18px;
      display: grid;
      place-items: center;
      background: linear-gradient(145deg, #6d5cff, #4f46e5);
      color: white;
      font-family: 'Outfit', sans-serif;
      font-weight: 700;
      font-size: 28px;
      box-shadow: 0 8px 28px rgba(124,108,255,.4);
    }
    h1 {
      font-family: 'Outfit', 'IBM Plex Sans Arabic', sans-serif;
      font-size: 26px;
      font-weight: 700;
      margin-bottom: 10px;
      letter-spacing: -0.3px;
    }
    p {
      color: #8b95a8;
      font-size: 14px;
      line-height: 1.8;
      margin-bottom: 28px;
    }
    a {
      display: block;
      background: linear-gradient(135deg, #7c6cff, #5b4fe0);
      color: white;
      padding: 14px 20px;
      border-radius: 14px;
      font-weight: 600;
      font-size: 14px;
      text-decoration: none;
      box-shadow: 0 4px 18px rgba(124,108,255,.35);
      transition: transform .15s, filter .15s;
    }
    a:hover { transform: translateY(-1px); filter: brightness(1.08); }
    small {
      display: block;
      margin-top: 18px;
      color: #5c6678;
      font-size: 11px;
      letter-spacing: .8px;
      direction: ltr;
    }
  </style>
</head>
<body>
  <main>
    <div class="logo" aria-hidden="true">W</div>
    <h1>Wormstar</h1>
    <p>المشروع يعمل على Cloudflare مباشرةً.<br>سيتم فتح التطبيق الرسمي.</p>
    <a href="https://wormstar-ai-lab.abdulstarzeki001.workers.dev/">فتح Wormstar AI Lab</a>
    <small>SECURE CLOUD WORKSPACE</small>
  </main>
</body>
</html>
