name: Wormstar Quality Gate

on:
  pull_request:
    branches: [main, develop]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  terminal:
    name: Private Terminal Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install terminal test dependencies
        run: python -m pip install -r integrations/wormstar-linux-terminal/requirements.txt
      - name: Test authentication, sandbox validation and terminal protocol
        run: python -m unittest discover -s integrations/wormstar-linux-terminal/tests -v

  terminal-docker:
    name: Docker Terminal Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: integrations/wormstar-linux-terminal
    env:
      TERMINAL_ACCESS_TOKEN: ci_only_terminal_token_1234567890abcdef
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install isolated terminal dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements.txt
      - name: Exercise a disposable real Docker sandbox and WebSocket
        shell: bash
        run: |
          set -euo pipefail
          if docker container inspect wormstar-linux-terminal-sandbox >/dev/null 2>&1; then
            echo 'Refusing to reuse an existing sandbox in the smoke test.' >&2
            exit 1
          fi
          cleanup() {
            if [[ -n "${server_pid:-}" ]]; then kill "$server_pid" 2>/dev/null || true; fi
            docker rm -f wormstar-linux-terminal-sandbox >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          bash start.sh > "$RUNNER_TEMP/wormstar-terminal.log" 2>&1 &
          server_pid=$!
          if ! .venv/bin/python tests/docker_smoke.py; then
            cat "$RUNNER_TEMP/wormstar-terminal.log" >&2
            exit 1
          fi

  uboor:
    name: UBOOR Offline Lab Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test offline lab with synthetic data
        run: bash scripts/run-uboor-lab.sh

  core:
    name: Core + Policy + RAG Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test Core, permissions and retrieval
        working-directory: cloudflare-worker
        run: npm test

  sentinel:
    name: Sentinel + Same-Origin Audit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Bundle, syntax check and exercise HTTP routes
        working-directory: wormstar-ui
        run: npm test

  ish:
    name: iSH Analyzer and Report Schema
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Test offline analyzer (no third-party network access)
        run: |
          python3 -m py_compile integrations/star-cyber-audit-ish/analyze.py
          python3 -m unittest discover -s integrations/star-cyber-audit-ish/tests -p 'test_*.py' -v
          python3 -m unittest discover -s scripts/tests -p 'test_sync_*.py' -v
      - name: Static inventory of checked-in Sentinel source
        run: |
          python3 integrations/star-cyber-audit-ish/analyze.py --local wormstar-ui
          node scripts/ci/validate-ish-report.mjs integrations/star-cyber-audit-ish/reports/analysis.json
      - name: Save sanitized inventory summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ish-inventory-${{ github.sha }}
          path: artifacts/ish-inventory-summary.json
          if-no-files-found: ignore
          retention-days: 14

  security:
    name: Commit-Scoped Security Gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify scanner regression tests
        run: node --test scripts/ci/test-security-gate.mjs
      - name: Inspect added lines and bind report to commit SHA
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          REPORT_PATH: artifacts/security-gate.json
        run: node scripts/ci/security-gate.mjs
      - name: Archive report even when checks fail
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-gate-${{ github.sha }}
          path: artifacts/security-gate.json
          if-no-files-found: ignore
          retention-days: 14
