name: STAR OSINT AI (local integration)

on:
  push:
    paths:
      - 'integrations/star-osint-ai/**'
      - '.github/workflows/star-osint-ai.yml'
  pull_request:
    paths:
      - 'integrations/star-osint-ai/**'
      - '.github/workflows/star-osint-ai.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  osint-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check module exists
        id: module
        run: |
          if [ -f integrations/star-osint-ai/requirements.txt ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Module not imported yet: run scripts/import-star-osint-ai.sh locally."
          fi

      - name: Set up Python
        if: steps.module.outputs.exists == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: integrations/star-osint-ai/requirements.txt

      - name: Install Python dependencies
        if: steps.module.outputs.exists == 'true'
        working-directory: integrations/star-osint-ai
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run offline unit tests
        if: steps.module.outputs.exists == 'true'
        working-directory: integrations/star-osint-ai
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m pytest -q

      - name: Refuse accidental runtime files
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          root = Path("integrations/star-osint-ai")
          tracked = subprocess.check_output(["git", "ls-files", "-z", str(root)]).split(b"\0")
          bad = []
          for item in tracked:
              if not item:
                  continue
              p = Path(item.decode())
              rel = p.relative_to(root)
              if rel.name in {".env", "id_rsa"} or rel.suffix.lower() in {".db", ".sqlite", ".sqlite3", ".pem", ".key"}:
                  bad.append(str(p))
              if rel.parts[0] in {"data", "reports"} and rel.name != ".gitkeep":
                  bad.append(str(p))
          if bad:
              raise SystemExit("Disallowed tracked files:\n" + "\n".join(sorted(set(bad))))
          print("No tracked STAR OSINT runtime data or key files.")
          PY
