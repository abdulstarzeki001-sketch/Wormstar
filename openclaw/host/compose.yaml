name: wormstar-openclaw
services:
  openclaw-gateway:
    image: ${OPENCLAW_IMAGE:-ghcr.io/openclaw/openclaw:latest}
    restart: unless-stopped
    init: true
    entrypoint: ["node", "dist/index.js"]
    command: ["gateway", "--bind", "lan", "--port", "18789"]
    environment:
      HOME: /home/node
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN:?Set Gateway token in .env}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?Set authorized provider API key in .env}
      OPENCLAW_DISABLE_BONJOUR: "1"
    volumes:
      - openclaw_state:/home/node/.openclaw
    ports:
      - "127.0.0.1:18789:18789"
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    pids_limit: 512
    stop_grace_period: 30s

  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on: ["openclaw-gateway"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]

volumes:
  openclaw_state:
