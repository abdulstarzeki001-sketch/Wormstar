name = "wormstar-ai-lab"
main = "worker.js"
compatibility_date = "2026-10-25"
workers_dev = true

# Sample only 10% of deliberately sanitized application logs; omit automatic
# invocation logs to reduce risk of recording sensitive request metadata.
[observability]
enabled = true

[observability.logs]
enabled = true
invocation_logs = false
head_sampling_rate = 0.1

[ai]
binding = "AI"

[[d1_databases]]
binding = "DB"
database_name = "wormstar_ai_memory"
database_id = "d9d08aa3-184f-47aa-bc2b-a9f53c0bd2aa"
