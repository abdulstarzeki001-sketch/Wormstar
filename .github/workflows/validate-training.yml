name: Validate external GPT-OSS LoRA scaffold
on:
  push:
    branches: [main]
    paths:
      - "training/lora/**"
      - ".github/workflows/validate-training.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lint-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile training script without GPU or model download
        run: python -m py_compile training/lora/train.py
      - name: Verify example conversation dataset
        run: python training/lora/train.py --dataset training/lora/example-dataset.jsonl
